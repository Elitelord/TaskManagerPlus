# CMake generator selection for cargo build-scripts that compile native C/C++
# (notably `llama-cpp-sys-2`, the Phase 5 generative-LM runtime, which builds
# llama.cpp via the `cmake` crate).
#
# We deliberately do NOT pin CMAKE_GENERATOR. It was previously pinned to
# "Visual Studio 17 2022" because one dev machine's auto-selection picked a
# phantom VS 18 2026 *preview* with no usable instance. But GitHub's hosted
# Windows runners have since upgraded to a real Visual Studio 18 (2026), and a
# hard "17 2022" pin then fails there with "could not find any instance of
# Visual Studio". Letting CMake auto-detect tracks whatever VS is actually
# installed — VS 17 on older machines, VS 18 on the current runners — and
# matches the toolchain cc-rs already auto-detects for the very same crate.
#
# If a contributor's machine has a broken VS preview that auto-detect would
# pick, override it locally by exporting CMAKE_GENERATOR in your environment
# (e.g. `Visual Studio 17 2022`).
