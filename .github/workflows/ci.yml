name: CI

# Z5-D — env-level pins:
#  * FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 opts into Node 24 ahead of
#    the June 2026 GitHub forced switch (silences the Node 20
#    deprecation warning while we still have v4 action tags).
#  * Runner image pinned via `runs-on: windows-2025` on the job below
#    instead of `windows-latest`, so a future GitHub default flip to
#    a different Windows runner can't silently change our build env.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. force-pushes / rebased PRs).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck (Windows)
    runs-on: windows-2025
    # A cold run builds llama.cpp from scratch (~20 min) on top of everything
    # else, which blew past the old 30 min cap — and a canceled job never runs
    # the cache-save post-step, so it could never warm the cache and kept timing
    # out. 50 min lets one cold run finish and save the cache; warm runs are
    # ~14 min.
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Pinned to an exact patch, not bare '24'. setup-node resolves a loose
      # major to the newest release, and the bundled npm moves with it — v24.11.1
      # ships npm 11.6.2 while v24.19.0 ships 11.17.0. Those two disagree about
      # where @emnapi lands in the tree, so a lockfile generated locally was
      # rejected by CI with "Missing: @emnapi/core from lock file" (v2.6.2).
      # Pinning keeps CI on the same npm as local development; bump this
      # deliberately, alongside a lockfile regenerated on the same version.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.11.1'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo + src-tauri/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # `target/` holds llama-cpp-sys's CMake build dir, whose CMakeCache.txt
          # pins the Visual Studio instance it was configured with. When GitHub
          # rotated the runner to VS 2026, restoring a VS-2022-era cache made
          # `cmake --build` fail ("could not find specified instance of Visual
          # Studio") because the crate skips re-configuring an existing build
          # dir. Bump this prefix to discard those stale caches.
          prefix-key: "v2026-rust"

      # NOTE: we deliberately do NOT cache native/build. A cached CMakeCache.txt
      # pins the absolute path of the Visual Studio instance it was configured
      # with; when GitHub rotates the runner image (moving/upgrading VS), the
      # restored cache fails with "could not find specified instance of Visual
      # Studio". The native DLL is ~17 small C++ files and configures + builds
      # in well under a minute, so a fresh configure every run is cheap and
      # robust. (release.yml already builds it fresh.)

      - name: Install npm deps
        run: npm ci

      - name: Frontend typecheck + build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Configure native DLL (CMake)
        run: cmake -S native -B native/build -A x64

      - name: Build native DLL (Release)
        run: cmake --build native/build --config Release

      - name: Verify DLL output
        shell: pwsh
        run: |
          $dll = "native/build/Release/taskmanager_native.dll"
          if (-not (Test-Path $dll)) {
            Write-Error "Expected DLL not found at $dll"
            exit 1
          }
          Get-Item $dll | Select-Object FullName, Length

      # Y2-A — MCP sidecar build dance. See release.yml for the full
      # chicken-and-egg explanation. TLDR: tauri-build's resource check
      # runs as a cargo build script for the lib; building tmp_mcp
      # requires the lib; so we bootstrap with an empty placeholder
      # that the real build then overwrites.
      # Guards the invariant that broke v2.7.0's release build twice. Tauri's
      # NSIS bundler enumerates binaries as:
      #
      #     std::fs::read_dir(tauri_dir.join("src/bin"))
      #       .map(|entry| entry.path().file_stem() ...)
      #
      # `read_dir` yields DIRECTORIES as well as files and nothing filters to
      # `.rs`, so a module subdirectory like `src/bin/lite/` becomes a phantom
      # binary named `lite`. The bundler then stats `target/release/lite.exe`,
      # which cargo never produced, and fails with "failed to bundle project:
      # when getting size of ...". This mirrors that logic exactly — every entry
      # in src/bin, files and directories alike — so keep the two in sync.
      #
      # The smoke build below runs `--no-bundle`, which skips the bundler
      # entirely, so nothing else in CI can catch this. Ten seconds here beats
      # finding out 30 minutes into a release build.
      - name: Verify src/bin entries match [[bin]] names
        shell: pwsh
        run: |
          # No -Filter and no -File: directories must be checked too, because
          # that is what the bundler does.
          $entries = Get-ChildItem src-tauri/src/bin
          $stems = $entries | ForEach-Object { [System.IO.Path]::GetFileNameWithoutExtension($_.Name) }
          $meta = cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | ConvertFrom-Json
          $binNames = $meta.packages.targets | Where-Object { $_.kind -contains 'bin' } | ForEach-Object { $_.name }
          $missing = @($stems | Where-Object { $binNames -notcontains $_ })
          if ($missing.Count -gt 0) {
            Write-Error ("src/bin entries with no matching [[bin]] name: {0}. Tauri's bundler will look for <name>.exe and fail. Move module directories out of src/bin (e.g. to src/<name>/), or rename the entry to match its bin name." -f ($missing -join ', '))
            exit 1
          }
          Write-Host "OK - every src/bin entry maps to a bin target: $($stems -join ', ')"

      - name: Bootstrap sidecar placeholders
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($name in @("tmp_mcp.exe", "tmp_widget.exe")) {
            $stub = Join-Path $dir $name
            if (-not (Test-Path $stub)) {
              New-Item -ItemType File -Path $stub | Out-Null
            }
          }

      - name: Build MCP sidecar (tmp_mcp)
        working-directory: src-tauri
        run: cargo build --release --bin tmp_mcp --locked

      # Lite-mode tray widget — also a bundled resource, so the same
      # placeholder/real-build sequence applies.
      - name: Build lite-mode widget (tmp_widget)
        working-directory: src-tauri
        run: cargo build --release --bin tmp_widget --locked

      # Phase A (lite mode) — standalone native app, shipped as its own zip by
      # release.yml. Built here purely so a break in it fails CI rather than
      # showing up mid-release.
      - name: Build lite-mode app (taskmanagerplus-lite)
        working-directory: src-tauri
        run: cargo build --release --bin taskmanagerplus-lite --locked

      - name: Rust check (src-tauri)
        working-directory: src-tauri
        run: cargo check --locked

      # Runs the AI classifier unit tests — including the bundled leak-model
      # JSON parse and the Rust<->Python feature-extraction parity test, so a
      # malformed or out-of-sync model file fails CI before it can ship.
      - name: Rust tests (src-tauri)
        working-directory: src-tauri
        run: cargo test --locked

      - name: Tauri smoke build (no bundle)
        run: npx tauri build --debug --no-bundle
