[package]
name = "taskmanagerplus"
version = "2.5.0"
edition = "2021"
# Y2-A added a second [[bin]] (tmp_mcp) — without this, `cargo run` and
# `tauri dev` fail with "could not determine which binary to run" because
# there's no longer a single default. Pin the main app as the default.
default-run = "taskmanagerplus"

[lib]
name = "taskmanagerplus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Y2-A: MCP sidecar binary. Console subsystem (vs the main app's
# `windows_subsystem = "windows"`) so stdin/stdout are wired up and MCP
# clients can talk over stdio. Shares ffi.rs and friends with the main
# app via the lib above — single source of truth for telemetry shapes.
# Bundled into the installer via tauri.conf.json `resources`.
[[bin]]
name = "tmp_mcp"
path = "src/bin/tmp_mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# libloading drives two things:
#   • the existing taskmanager_native.dll FFI (Phase 1+), and
#   • the new Y1-A prebuilt llama.cpp Vulkan DLL set (Phase 6).
# Single dep covers both; no version bump needed for Y1-A.
libloading = "0.8"
log = "0.4"
env_logger = "0.11"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tauri-plugin-notification = "2.3.3"
trash = "5"
# BLAKE3 is ~2-3× faster than SHA-256 on large files via SIMD and has no quality
# concerns for dedup (collision-resistant cryptographic hash). Used by the Smart
# Organizer's duplicate-file detector, which only hashes files whose size already
# collided with another file's size — the size pre-filter cuts the I/O surface
# by 10-100×, so the hash cost is bounded even on multi-hundred-GB folders.
blake3 = "1"
# HTTP client for download-on-demand of AI model files (Phase 3). Blocking
# API, called from a worker thread; rustls so there is no OpenSSL dependency.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# Pure-Rust ONNX inference for the Standard-tier semantic file features
# (Phase 3 / S4). Chosen over `ort` (ONNX Runtime) — see spike S-12: tract
# is pure Rust (no native library, no prerelease dependency), runs the
# 33 MB int8-quantized bge-small model, and matches the leak classifier's
# dependency-free design. Slower than ORT, but S4 embedding is a
# background pass where that doesn't matter.
tract-onnx = "0.21"
# Z4 — opt-in DirectML GPU embeddings. ort 2.x gives us access to the
# DirectML execution provider for the same bge-small ONNX model the CPU
# path runs through tract. `load-dynamic` means we don't statically link
# onnxruntime.dll into the binary — instead we point ort at a downloaded
# bundle at runtime, mirroring the Y1-A Vulkan llama.cpp DLL bundle.
# Without that the installer would gain ~15 MB for a feature most users
# won't enable. `directml` enables the EP wiring code-side; the actual
# acceleration requires the user to download the ort-dml runtime bundle
# from the Settings card.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "directml"] }
# Hugging Face tokenizer — matches the tokenizer.json the embedding model
# ships with. WordPiece (BERT-family), so the Oniguruma regex feature is
# not needed.
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
# Text extraction for S4 content embedding (Phase 3): .docx is a zip of
# XML; .pdf needs a parser. Plain-text/code files use std directly.
zip = "2"
pdf-extract = "0.7"
# Parallel text extraction across the 150-file S4 candidate batch. PDF
# parsing is single-threaded and the slow part of `ai_embed_files`; using
# the global rayon pool turns a serial wait into a fan-out.
rayon = "1"

# Y2-A — MCP server (Phase 6). Anthropic-blessed Rust SDK. Spike at
# scripts/ml/mcp_probe/ proved 1.7.0 builds + runs cleanly with the
# existing tokio/tauri stack on MSVC; integration uses the same
# `#[tool_router]` + `#[tool_handler]` pattern. `transport-io` brings
# stdio; `macros` brings the tool routing attribute macros.
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
# Used by mcp/mod.rs for structured server-side logging (stderr only;
# stdout is the MCP JSON-RPC channel). tracing is in the dep graph
# already via tauri's plugins; pulling it in as a direct dep so the
# version is explicit.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# Z2 — workload classifier ports the WORKLOAD_RULES regex tables from
# `src/lib/insights.ts` into Rust so the MCP server can answer
# `get_workload` without re-invoking JS. RegexSet pre-compiles all
# patterns per category for a single-pass match per process name.
regex = "1"

# Dev-profile debuginfo trimmed to line tables only. The default (debug = 2)
# emits full debug info / PDB symbols for every dependency, which is what
# bloated target/debug to 30+ GB. "line-tables-only" keeps file:line mapping
# so RUST_BACKTRACE backtraces and panic locations stay accurate — the only
# thing dropped is local-variable inspection in a native Rust debugger, which
# this app doesn't use (debugging happens in the webview + via logs). Has zero
# effect on runtime behavior or the release build. Revert to `debug = 2` if
# full Rust step-debugging is ever needed.
[profile.dev]
debug = "line-tables-only"

[target.'cfg(windows)'.dependencies]
# On-device generative LM runtime (Phase 5). Bundles + builds llama.cpp via
# CMake/MSVC on first compile (~2-3 min). Windows-only, matching the app's
# target; the model itself (SmolLM2-360M GGUF) downloads on demand. The CMake
# generator is pinned in `.cargo/config.toml` — without it cmake-rs can pick a
# phantom VS preview it can't use. See A2 in docs/AI_INTEGRATION_PLAN.md.
llama-cpp-2 = "0.1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    # NtQueryInformationProcess(ProcessCommandLineInformation) — reads a
    # process's command line in-process (µs) instead of spawning powershell.exe.
    "Wdk_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Devices_Display",
    "Win32_Devices_Bluetooth",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
] }
